name: Chinese release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          bash tools/build-app.sh
          ".build/RemoveMacAI 中文版.app/Contents/MacOS/RemoveMacAI" selftest
      - name: Package
        run: |
          python3 -m venv .build/dmg-venv
          .build/dmg-venv/bin/pip install -r tools/dmg-requirements.txt
          .build/dmg-venv/bin/python tools/build-dmg.py
          ditto -c -k --norsrc --keepParent ".build/RemoveMacAI 中文版.app" dist/RemoveMacAI-1.0.1-zh-Hans.1-arm64.zip
          cp README.zh-Hans.md dist/RemoveMacAI-Guide-zh-Hans.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.1-zh-Hans.1 dist/* --target "$GITHUB_SHA" --title "RemoveMacAI 1.0.1 简体中文版" --notes-file RELEASE_NOTES.zh-Hans.md
