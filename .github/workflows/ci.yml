name: CI
on:
  push:
    branches: [main, zh-Hans]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build Chinese app
        run: bash tools/build-app.sh
      - name: Self-test
        run: '".build/RemoveMacAI 中文版.app/Contents/MacOS/RemoveMacAI" selftest'
      - name: Package DMG
        run: |
          python3 -m venv .build/dmg-venv
          .build/dmg-venv/bin/pip install -r tools/dmg-requirements.txt
          .build/dmg-venv/bin/python tools/build-dmg.py
